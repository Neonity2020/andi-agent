<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>andi-agent</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/vendor/katex.min.css" />
  </head>
  <body>
    <main class="shell">
      <aside id="sidebar" class="sidebar">
        <div class="brand"><span class="brand-mark">a</span><span>andi-agent</span></div>
        <button id="new-session" class="new-session">+ 新建会话</button>
        <div class="section-label">SESSIONS</div>
        <nav id="sessions" class="sessions"></nav>
        <div class="sidebar-footer"><span class="status-dot"></span><span id="workspace">本地工作区</span></div>
      </aside>
      <button id="sidebar-backdrop" class="sidebar-backdrop hidden" aria-label="关闭侧边栏"></button>
      <section class="conversation">
        <header class="topbar">
          <div class="topbar-leading"><button id="sidebar-toggle" class="icon-button" aria-label="折叠侧边栏" title="折叠侧边栏">☰</button><div><div id="session-title" class="session-title">default</div><div id="model-label" class="model-label">连接中...</div></div></div>
          <button id="cancel" class="ghost hidden">停止运行</button>
        </header>
        <div id="messages" class="messages">
          <div class="empty-state"><div class="eyebrow">LOCAL CODING AGENT</div><h1>让 andi 处理<br /><em>真正的工作。</em></h1><p>阅读代码、运行验证、管理会话。所有数据都留在这台机器上。</p></div>
        </div>
        <div class="composer-wrap">
          <div id="approval" class="approval hidden"></div>
          <form id="composer" class="composer"><textarea id="task" rows="1" placeholder="描述你想完成的任务..." autofocus></textarea><button aria-label="发送">↑</button></form>
          <div class="hint">Enter 发送 · Shift + Enter 换行 · 本地模式</div>
        </div>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
